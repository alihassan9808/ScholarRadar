<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScholarRadar | Funding opportunities</title><style>body{margin:0;font:16px system-ui;background:#f3f6fa;color:#14253a}header{background:#12334d;color:white;padding:48px 7%}main{max-width:950px;margin:auto;padding:24px}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #bccbd5;border-radius:9px}article{background:white;padding:22px;margin:14px 0;border-radius:12px}a{color:#087a83}small{color:#526477}footer{padding:24px;text-align:center}</style><header><b>ScholarRadar</b><h1>Find your next research opportunity.</h1><p>Explore official scholarship portals and research vacancies worldwide.</p></header><main><input id="q" placeholder="Search by country or program" aria-label="Search"><p id="status"></p><section id="results"></section></main><footer>Independent directory. Always verify funding and deadlines on the official source.</footer><script>const portals=[{title:'DAAD scholarship database',country:'Germany',url:'https://www.daad.de/en/studying-in-germany/scholarships/daad-scholarship-database/'},{title:'EURAXESS research jobs',country:'Europe',url:'https://euraxess.ec.europa.eu/jobs/search'},{title:'MEXT scholarships',country:'Japan',url:'https://www.studyinjapan.go.jp/en/planning/scholarships/mext-scholarships/'},{title:'Erasmus Mundus Joint Masters',country:'Europe',url:'https://www.eacea.ec.europa.eu/scholarships/erasmus-mundus-catalogue_en'},{title:'Taiwan Scholarship',country:'Taiwan',url:'https://taiwanscholarship.moe.gov.tw/'}];let items=portals;function draw(){const q=document.querySelector('#q').value.toLowerCase();const root=document.querySelector('#results');root.replaceChildren();for(const x of items.filter(x=>(x.title+' '+x.country).toLowerCase().includes(q))){const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),l=document.createElement('a');h.textContent=x.title;p.textContent=x.country+' · '+(x.kind||'Official funding portal');l.textContent='Visit official source';l.href=x.url;l.target='_blank';l.rel='noopener noreferrer';a.append(h,p,l);root.append(a)}}document.querySelector('#q').oninput=draw;draw();fetch('opportunities.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{items=[...d.items,...portals];document.querySelector('#status').textContent='Feed last checked: '+d.updated;draw()}).catch(()=>{document.querySelector('#status').textContent='Browse official funding portals.'});</script></html>
