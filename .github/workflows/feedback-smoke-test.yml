name: Feedback smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/feedback-smoke-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for deployment and test feedback
        run: |
          base=https://scholarradar-bsv.pages.dev
          for i in $(seq 1 18); do
            if curl -fsS "$base/api/feedback" | jq -e '.configured == true and .version == "4"'; then break; fi
            sleep 10
          done
          curl -fsS "$base/api/feedback" | jq -e '.configured == true and .version == "4"'
          curl --max-time 25 -fsS -X POST "$base/api/feedback" -H "Origin: $base" -H "Content-Type: application/json" --data '{"Type":"Feedback","Message":"Automated ScholarRadar technical delivery test; not a public review."}' | jq -e '.ok == true'
