name: ScholarRadar LinkedIn introduction
on:
  push:
    paths:
      - '.github/workflows/linkedin-launch.yml'
permissions:
  contents: read
concurrency: scholar-linkedin-launch
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Queue introduction after checking website
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          if os.environ.get("GITHUB_RUN_ATTEMPT") != "1":
              raise SystemExit("No retries to avoid duplicate posts")
          with urllib.request.urlopen("https://scholarradar-bsv.pages.dev/",timeout=25) as res:
              if res.status != 200 or "ScholarRadar" not in res.read().decode(errors="replace"):
                  raise SystemExit("Website verification failed")
          def query(q):
              req=urllib.request.Request("https://api.buffer.com",data=json.dumps({"query":q}).encode(),headers={"Authorization":"Bearer "+os.environ["BUFFER_API_KEY"],"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=30) as res:
                  result=json.load(res)
              if result.get("errors"):
                  raise SystemExit("Buffer GraphQL request failed")
              return result["data"]
          orgs=query("query { account { organizations { id } } }")["account"]["organizations"]
          channels=[]
          for org in orgs:
              channels.extend(c for c in query("query { channels(input: { organizationId: "+json.dumps(org["id"])+" }) { id service } }")["channels"] if str(c["service"]).lower()=="linkedin")
          if len(channels)!=1:
              raise SystemExit("Expected exactly one LinkedIn channel")
          message="🎓 Looking for international scholarships and research opportunities?\n\nExplore ScholarRadar — a free platform for discovering scholarships, internships, funded PhD opportunities and research vacancies.\n\nBrowse opportunities and find links to official application websites.\n\n🌐 https://scholarradar-bsv.pages.dev/\n\n#Scholarships #PhD #Internships #StudyAbroad #ResearchOpportunities #ScholarRadar"
          q="mutation { createPost(input: { text: "+json.dumps(message,ensure_ascii=False)+", channelId: "+json.dumps(channels[0]["id"])+", schedulingType: automatic, mode: addToQueue }) { ... on PostActionSuccess { post { id dueAt } } ... on MutationError { message } } }"
          result=query(q)["createPost"]
          if not result.get("post"):
              raise SystemExit("Buffer rejected post")
          print("Queued:",result["post"])
          PY
